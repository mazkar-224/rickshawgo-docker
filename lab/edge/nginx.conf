# LAB ONLY - the "router" in front of the VM.
# My VM is a container on a private Docker network, so nothing on my Mac can reach its ports 80/443
# directly. This tiny Nginx (stream = plain TCP, no TLS termination) forwards the Mac's ports 80 and 443
# to the VM, like port forwarding on a home router or a cloud load balancer in TCP mode.
# TLS is still terminated by Nginx ON THE VM, with the VM's certificate.
worker_processes 1;
events { worker_connections 1024; }
stream {
    server { listen 80;  proxy_pass 10.30.0.10:80; }
    server { listen 443; proxy_pass 10.30.0.10:443; }
}
