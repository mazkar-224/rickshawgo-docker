# /etc/nginx/sites-available/rickshawgo  (linked into sites-enabled)
# RickshawGo API, Dockerized: Nginx on the VM terminates TLS and load-balances two containers.

upstream rickshawgo_containers {
    zone rickshawgo_containers 64k;              # all Nginx workers share one view of the upstreams
    # the containers publish their port on 127.0.0.1 only (compose.yaml)
    server 127.0.0.1:3101 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:3102 max_fails=1 fail_timeout=2s;
    keepalive 16;                                # reuse connections to the containers
}

# HTTP: only redirects to HTTPS (and would serve Let's Encrypt challenges on a public domain)
server {
    listen 80;
    listen [::]:80;
    server_name rickshawgo.azkar.test;
    server_tokens off;                           # don't advertise the Nginx version

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rickshawgo.azkar.test;
    server_tokens off;

    ssl_certificate     /etc/ssl/rickshawgo/fullchain.pem;
    ssl_certificate_key /etc/ssl/rickshawgo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:RickshawGoSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/rickshawgo.access.log;
    error_log  /var/log/nginx/rickshawgo.error.log;

    location / {
        proxy_pass http://rickshawgo_containers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # needed for upstream keepalive
        include proxy_params;                    # Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        # if one container is restarting, retry the request on the other one
        proxy_next_upstream error timeout http_502 http_503;
    }
}
