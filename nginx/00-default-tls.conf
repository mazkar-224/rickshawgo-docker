# /etc/nginx/sites-available/00-default-tls  (linked into sites-enabled)
# HTTPS requests for a name this server doesn't host are refused during the TLS handshake,
# instead of being answered with the certificate of whichever site happens to come first.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
